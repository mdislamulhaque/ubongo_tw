          <!-- User Section -->

    <!-- Main Content -->
    <main class="text-white font-sans w-full">
      <div class="flex items-start mt-12 justify-center p-4">
        <div class="bg-gray-800 p-6 rounded-xl w-full max-w-lg">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-semibold text-white">Edit profile</h2>
            <button
              class="px-4 py-1 bg-white text-gray-900 rounded hover:bg-gray-100 transition"
            >
              Save
            </button>
          </div>

          <div class="flex flex-col sm:flex-row items-center gap-4">
            <!-- Avatar -->
            <div class="flex flex-col items-center">
              <div
                class="w-20 h-20 rounded-lg overflow-hidden bg-yellow-200 flex items-center justify-center"
              >
                <img
                  src="./assets/ubongoKids/koba-icon.png"
                  alt="Avatar"
                  class="w-full h-full object-cover"
                />
              </div>

              <!-- Hidden file input -->
              <input id="fileInput" type="file" class="hidden" />

              <!-- Styled button to trigger file input -->
              <a
                href="./choseImage.html"
                class="mt-2 px-3 py-1 bg-sky-400 text-sm rounded inline-block hover:bg-sky-500 transition"
              >
                Choose Picture
              </a>
            </div>

            <!-- Form Fields -->
            <div class="flex flex-col gap-3 flex-1 w-full">
              <input
                type="text"
                placeholder="User Name"
                class="bg-yellow-200 text-gray-700 px-3 py-2 rounded focus:outline-none placeholder-gray-500 w-full"
              />

              <div
                class="flex items-center justify-between bg-yellow-200 px-3 py-2 rounded w-full"
              >
                <span class="text-gray-700">Content Language</span>
                <select class="bg-transparent focus:outline-none text-gray-700">
                  <option>English</option>
                  <option>Amharic</option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
